name: forcebalance-test
channels:
  - conda-forge
  - openeye
dependencies:
    # Base depends
  - python
  - pip
    # Testing
  - pytest
  - pytest-cov
  - pytest-timeout
  - codecov
  - numpy
  - scipy
  - lxml
  - networkx
  - zlib
  - swig
  - future
  - pymbar =3
  - openmm >= 8
  - ambertools
  - ndcctools
  - geometric
  # - gromacs =2019.1
  - openff-toolkit >=0.18.0
  - openff-interchange >=0.5.1
  - openff-evaluator-base >= 0.5.3
